{% set name = "babel" %}
{% set version = "2.18.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b80b99a14bd085fcacfa15c9165f651fbb3406e66cc603abf11c5750937c992d

build:
  number: 0
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - pybabel = babel.messages.frontend:main

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - pytz >=2015.7  # [py<39]

# E   ModuleNotFoundError: No module named 'myproject'
{% set ignored_tests = " --ignore=tests/messages/data/project/issue_1224_test.py" %}
# E       AssertionError: assert 'GMT+00:00' == 'GMT+03:00'
{% set deselected_tests = " --deselect=tests/test_dates.py::test_get_timezone_name_misc" %}

test:
  source_files:
    - tests
    - babel/locale-data
    - babel/global.dat
  imports:
    - babel
    - babel.localtime
    - babel.messages
  requires:
    - pip
    - pytest >=6.0
    - freezegun >=1,<2
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pybabel --help
    - pytest -vv tests {{ ignored_tests }} {{ deselected_tests }}

about:
  home: https://babel.pocoo.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Utilities to internationalize and localize Python applications
  description: |
    Babel is an integrated collection of utilities that assist in
    internationalizing and localizing Python applications, with an emphasis
    on web-base applications.
  doc_url: https://babel.pocoo.org
  dev_url: https://github.com/python-babel/babel

extra:
  recipe-maintainers:
    - frol
    - nehaljwani
